<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0b7285" stroke="#062b55" stroke-width="4"/>
  
  <!-- R letter -->
  <g fill="white" font-family="Arial, sans-serif" font-size="90" font-weight="bold">
    <text x="50" y="130" text-anchor="middle">R</text>
  </g>
  
  <!-- B letter -->
  <g fill="#0b7285" font-family="Arial, sans-serif" font-size="80" font-weight="bold">
    <text x="130" y="125" text-anchor="middle">B</text>
  </g>
  
  <!-- Decorative circle accent in teal -->
  <circle cx="140" cy="80" r="20" fill="#9ff3f0" opacity="0.7"/>
</svg>